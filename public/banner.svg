<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Sintaxis y Compás — Podcast de Desarrollo y Creatividad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#070912" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#06b6d4" stroke-opacity="0.16" stroke-width="1" />
      <path d="M20 0V40M0 20H40" fill="none" stroke="#d946ef" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Cyber-Studio -->
  <rect width="1200" height="420" rx="26" fill="#06070e" />
  <rect width="1200" height="420" rx="26" fill="url(#bg)" opacity="0.55" />
  <rect width="1200" height="420" rx="26" fill="url(#grid)" />

